body{margin:0;background:#0B0B0C;font-family:'Onest',system-ui,sans-serif;color:#F4F2EE;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:0}

@keyframes t3-fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes t3-fade{from{opacity:0}to{opacity:1}}
@keyframes t3-shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes t3-spin{to{transform:rotate(360deg)}}
@keyframes t3-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes t3-ind{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes t3-fill{from{width:0}to{width:100%}}
@keyframes t3-kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes t3-slidein{from{transform:translateX(100%)}to{transform:none}}
.t3-skel{background:linear-gradient(90deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.06) 100%);background-size:1200px 100%;animation:t3-shimmer 1.4s linear infinite}
.t3-in{animation:t3-fadeup .45s cubic-bezier(.2,0,0,1) both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.vx-row{display:flex;overflow:hidden}
.vx-card img{transition:opacity .2s}
.vx-hover .vx-art{box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.vx-focusring{outline:2px solid #F4F2EE;outline-offset:3px}
@keyframes vx-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes vx-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes vx-pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes vx-ripple{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.3)}}
@keyframes vx-wave{0%,100%{opacity:.25}50%{opacity:1}}
.vx-sheet{animation:vx-up .32s cubic-bezier(.2,0,0,1) both}
.vx-pop{animation:vx-pop .18s cubic-bezier(.2,0,0,1) both;transform-origin:top}
.vx-toast{animation:vx-in .25s cubic-bezier(.2,0,0,1) both}

@keyframes m-drift{from{transform:rotate(-8deg) scale(1.15) translateY(0)}to{transform:rotate(-8deg) scale(1.15) translateY(-160px)}}
@keyframes m-scan{from{transform:translateY(-100px)}to{transform:translateY(100px)}}
</style>
