body{margin:0;background:#0B0B0C;font-family:'Onest',system-ui,sans-serif;color:#F4F2EE;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:inherit}

.seg{position:relative;display:grid;grid-template-columns:repeat(3,168px);height:64px;padding:6px;box-sizing:border-box;border-radius:32px;background:#2A2A2E}
.seg input{position:absolute;opacity:0;width:0;height:0;margin:0;pointer-events:none}
.seg label{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#B6B4AF;cursor:pointer;transition:color .25s}
.seg input:checked+label{color:#F4F2EE}
.seg .thumb{position:absolute;left:6px;top:6px;width:168px;height:52px;border-radius:26px;background:#0B0B0C;box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.seg input:nth-of-type(2):checked~.thumb{transform:translateX(168px)}
.seg input:nth-of-type(3):checked~.thumb{transform:translateX(336px)}
.opt{position:relative;display:flex;align-items:center;gap:22px;height:76px;padding:0 28px;border-radius:22px;font-size:28px;font-weight:600;color:#F4F2EE;cursor:pointer;transition:background .2s}
.opt input{position:absolute;opacity:0;width:0;height:0;margin:0;pointer-events:none}
.opt .dot{width:34px;height:34px;flex-shrink:0;border-radius:17px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:transparent}
.opt .sub{margin-left:auto;font-size:22px;font-weight:500;color:#B6B4AF}
.opt:has(input:checked){background:rgba(255,255,255,.12)}
.opt input:checked~.dot{background:#F4F2EE;box-shadow:none;color:#111113}
.opt.focus,.opt.focus:has(input:checked){background:#F4F2EE;color:#111113;box-shadow:0 0 0 4px #FFFFFF,0 24px 60px rgba(0,0,0,.65)}
.opt.focus .sub{color:#4A4945}
.opt.focus .dot{box-shadow:inset 0 0 0 2px rgba(17,17,19,.4)}
.opt.focus input:checked~.dot{background:#111113;color:#F4F2EE}

@keyframes t3-fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes t3-fade{from{opacity:0}to{opacity:1}}
@keyframes t3-shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes t3-spin{to{transform:rotate(360deg)}}
@keyframes t3-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes t3-ind{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes t3-fill{from{width:0}to{width:100%}}
@keyframes t3-kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes t3-slidein{from{transform:translateX(100%)}to{transform:none}}
.t3-skel{background:linear-gradient(90deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.06) 100%);background-size:1200px 100%;animation:t3-shimmer 1.4s linear infinite}
.t3-in{animation:t3-fadeup .45s cubic-bezier(.2,0,0,1) both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
